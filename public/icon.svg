<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081438"/>
      <stop offset="100%" stop-color="#020716"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Plate -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>
  
  <!-- 4 Ludo Quadrants in Center -->
  <g transform="translate(96, 96)">
    <!-- Red Top Left -->
    <rect x="0" y="0" width="150" height="150" rx="28" fill="#E53935" stroke="#FFCDD2" stroke-width="4"/>
    <circle cx="75" cy="75" r="42" fill="#FFFFFF"/>
    <circle cx="75" cy="75" r="26" fill="#E53935"/>
    
    <!-- Green Top Right -->
    <rect x="170" y="0" width="150" height="150" rx="28" fill="#2E7D32" stroke="#C8E6C9" stroke-width="4"/>
    <circle cx="245" cy="75" r="42" fill="#FFFFFF"/>
    <circle cx="245" cy="75" r="26" fill="#2E7D32"/>
    
    <!-- Blue Bottom Left -->
    <rect x="0" y="170" width="150" height="150" rx="28" fill="#1E88E5" stroke="#BBDEFB" stroke-width="4"/>
    <circle cx="75" cy="245" r="42" fill="#FFFFFF"/>
    <circle cx="75" cy="245" r="26" fill="#1E88E5"/>
    
    <!-- Yellow Bottom Right -->
    <rect x="170" y="170" width="150" height="150" rx="28" fill="#FDD835" stroke="#FFF9C4" stroke-width="4"/>
    <circle cx="245" cy="245" r="42" fill="#FFFFFF"/>
    <circle cx="245" cy="245" r="26" fill="#FBC02D"/>
    
    <!-- Center Emblem Star / Dice -->
    <circle cx="160" cy="160" r="40" fill="#06102B" stroke="url(#goldGrad)" stroke-width="6"/>
    <path d="M160 132 L168 152 L189 152 L172 165 L178 185 L160 173 L142 185 L148 165 L131 152 L152 152 Z" fill="#FFDF00"/>
  </g>
  
  <!-- XT LUDO Header banner text -->
  <text x="256" y="78" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="#FFDF00" letter-spacing="4">XT LUDO</text>
</svg>
